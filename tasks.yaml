apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  steps:
    - name: npminstall
      image: node:20-buster-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "***** Environment *****"
        npm --version
        pwd
        echo "***** Cleaning npm cache *****"
        npm cache clean --force
        echo "***** Running npm install *****"
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: jasminetests
      image: node:20-buster-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "***** Running jasminetests *****"
        npx jasmine
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: openshift-fix
spec:
  description: Rewrites the web image configuration so nginx can run under OpenShift restricted SCC with an arbitrary non-root UID.
  workspaces:
    - name: source
  steps:
    - name: fix-nginx
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        cat > Dockerfile <<'DOCKERFILE'
        FROM nginx:alpine
        COPY nginx.conf /etc/nginx/nginx.conf
        COPY favicon.ico /usr/share/nginx/html/favicon.ico
        COPY index.html /usr/share/nginx/html/index.html
        COPY script.js /usr/share/nginx/html/script.js
        COPY style.css /usr/share/nginx/html/style.css
        COPY taxCalculator.js /usr/share/nginx/html/taxCalculator.js
        EXPOSE 8080
        DOCKERFILE

        cat > nginx.conf <<'NGINX'
        pid /tmp/nginx.pid;
        events {
          worker_connections 1024;
        }
        http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          access_log /dev/stdout;
          error_log /dev/stderr warn;

          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;

          server {
            listen 8080;
            listen [::]:8080;
            root /usr/share/nginx/html;
            index index.html;

            location / {
              try_files $uri $uri/ /index.html;
            }
          }
        }
        NGINX

        echo "***** OpenShift-compatible Dockerfile *****"
        cat Dockerfile
        echo "***** OpenShift-compatible nginx.conf *****"
        cat nginx.conf
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: app-name
      description: The name of the application
    - name: image-name
      description: The image to deploy
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      command: ["/bin/bash", "-c"]
      args:
        - |
          oc create deployment $(params.app-name) \
            --image=$(params.image-name) \
            --dry-run=client -o yaml | oc apply -f -
          oc rollout status deploy/$(params.app-name)
